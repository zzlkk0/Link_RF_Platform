[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-ranging-model"
version = "0.1.0"
description = "Cross-layer BLE/UWB/RFIC ranging simulation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
]

[project.scripts]
rf-ranging-demo = "rf_ranging_model.cli:main"
rf-ranging-web = "rf_ranging_model.webapp:main"

[tool.setuptools.packages.find]
include = ["rf_ranging_model*"]

[tool.setuptools.package-data]
rf_ranging_model = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
